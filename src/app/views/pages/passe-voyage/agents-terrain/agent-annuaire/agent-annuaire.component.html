<div class="row">
  <div class="col-md-12 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h5 class="mb-0">Annuaire des Agents Terrain</h5>
          <button class="btn btn-primary btn-icon-text" (click)="openModal(addAgentModal)">
            <i class="feather icon-plus btn-icon-prepend"></i>
            Nouvel Agent
          </button>
        </div>

        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th>Matricule</th>
                <th>Nom & Prénom</th>
                <th>Téléphone</th>
                <th>Statut</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let agent of agents">
                <td><strong>{{ agent.matricule }}</strong></td>
                <td>{{ agent.nom }}</td>
                <td>{{ agent.telephone }}</td>
                <td>
                  <span class="badge" [ngClass]="{'bg-success': agent.statut === 'Actif', 'bg-warning': agent.statut === 'En Congé'}">
                    {{ agent.statut }}
                  </span>
                </td>
                <td>
                  <button class="btn btn-sm btn-outline-primary btn-icon me-2">
                    <i class="feather icon-edit-2"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger btn-icon">
                    <i class="feather icon-trash-2"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Template -->
<ng-template #addAgentModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Ajouter un Agent Terrain</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>
  <div class="modal-body">
    <form>
      <div class="mb-3">
        <label class="form-label">Nom & Prénom</label>
        <input type="text" class="form-control" name="agentNom" [(ngModel)]="newAgent.nom" placeholder="Ex: Koffi Yao">
      </div>
      <div class="mb-3">
        <label class="form-label">Numéro de Téléphone</label>
        <input type="text" class="form-control" name="agentTel" [(ngModel)]="newAgent.telephone" placeholder="Ex: 01 02 03 04 05">
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.close('cancel')">Annuler</button>
    <button type="button" class="btn btn-primary" (click)="modal.close('save')" [disabled]="!newAgent.nom.trim() || !newAgent.telephone.trim()">Enregistrer</button>
  </div>
</ng-template>
