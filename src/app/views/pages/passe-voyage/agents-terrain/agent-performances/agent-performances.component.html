<div class="row">
  <div class="col-md-12 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h5 class="mb-0">Performances Journalières</h5>
            <p class="text-muted mt-1" style="font-size: 13px;">Suivi des validations de billets et ventes physiques par agent.</p>
          </div>
          <div class="d-flex align-items-center">
            <input type="date" class="form-control me-2" [value]="'2026-08-13'" style="max-width: 150px;">
            <button class="btn btn-outline-secondary btn-icon-text">
              <i class="feather icon-download btn-icon-prepend"></i>
              Exporter
            </button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th>Agent</th>
                <th>Gare (Aujourd'hui)</th>
                <th class="text-center">Billets Validés (Scans)</th>
                <th class="text-end">Ventes Physiques (FCFA)</th>
                <th>Appréciation</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let perf of performances">
                <td><strong>{{ perf.agent }}</strong></td>
                <td>{{ perf.gare }}</td>
                <td class="text-center">
                  <span class="badge rounded-pill bg-light text-dark border">{{ perf.validations }}</span>
                </td>
                <td class="text-end fw-bold text-success">{{ perf.ventesPhysiques | number:'1.0-0' }}</td>
                <td>
                  <span class="badge" 
                        [ngClass]="{'bg-success': perf.statut === 'Excellent', 'bg-primary': perf.statut === 'Bon', 'bg-warning': perf.statut === 'Moyen'}">
                    {{ perf.statut }}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
